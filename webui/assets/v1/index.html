<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>DarwinRouter</title>
  <link rel="stylesheet" href="__DARWIN_BASE_PATH__/assets/v1/app.css">
</head>
<body data-base-path="__DARWIN_BASE_PATH__">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <div><span class="mark" aria-hidden="true">D</span> DarwinRouter</div>
      <output id="connection-state" class="status">Shell ready</output>
    </header>
    <nav class="rail" aria-label="Primary">
      <a href="__DARWIN_BASE_PATH__/chats" data-view="chats" aria-current="page">Chats</a>
      <a href="__DARWIN_BASE_PATH__/workboards" data-view="workboards">Workboards</a>
    </nav>
    <main id="main" tabindex="-1">
      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Local-first agent runtime</p>
        <h1 id="welcome-title">DarwinRouter</h1>
        <p>The browser shell is installed. Chat and workboard services will appear here as their sprints land.</p>
      </section>
    </main>
  </div>
  <script src="__DARWIN_BASE_PATH__/assets/v1/app.js" defer></script>
</body>
</html>
