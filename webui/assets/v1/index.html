<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>DarwinRouter</title>
  <link rel="stylesheet" href="__DARWIN_BASE_PATH__/assets/v1/app.css">
</head>
<body data-base-path="__DARWIN_BASE_PATH__">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <div><span class="mark" aria-hidden="true">D</span> DarwinRouter</div>
      <output id="connection-state" class="status">Shell ready</output>
    </header>
    <nav class="rail" aria-label="Primary">
      <a href="__DARWIN_BASE_PATH__/chats" data-view="chats" aria-current="page">Chats</a>
      <a href="__DARWIN_BASE_PATH__/workboards" data-view="workboards">Workboards</a>
    </nav>
    <main id="main" tabindex="-1">
      <section id="chat-view" class="chat-view" aria-labelledby="chat-title">
        <aside class="chat-index" aria-labelledby="chat-list-title">
          <div class="section-heading">
            <div><p class="eyebrow">Sessions</p><h1 id="chat-list-title">Chats</h1></div>
            <output id="chat-count" class="count" aria-live="polite"></output>
          </div>
          <div id="chat-list-state" class="notice" role="status">Loading chats…</div>
          <ol id="chat-list" class="chat-list" aria-label="Chat sessions"></ol>
          <button id="load-more" class="secondary" type="button" hidden>Load more</button>
        </aside>
        <section class="transcript-panel" aria-labelledby="chat-title">
          <header class="transcript-heading">
            <div><p class="eyebrow">Read-only transcript</p><h2 id="chat-title">Select a chat</h2></div>
            <output id="chat-state" class="state-pill"></output>
          </header>
          <div id="transcript-state" class="notice" role="status">Choose a session to inspect its committed history.</div>
          <ol id="transcript" class="transcript" aria-label="Committed chat transcript"></ol>
          <button id="load-more-messages" class="secondary transcript-more" type="button" hidden>Load more messages</button>
          <div id="provisional" class="provisional-stack" aria-live="polite" aria-label="Provisional assistant output" hidden></div>
        </section>
      </section>
    </main>
  </div>
  <script src="__DARWIN_BASE_PATH__/assets/v1/app.js" defer></script>
</body>
</html>
