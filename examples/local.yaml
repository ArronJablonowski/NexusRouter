version: 1
mode: local_only
runtime:
  max_turns: 8  # Shared iteration budget for initial work and active steering.
providers:
  - id: local-primary
    kind: ollama
    endpoint: http://127.0.0.1:11434
models:
  - id: local-fast
    provider: local-primary
    model: local-model-id
    locality: local
    capabilities: [chat, summarize, classify]
    # Required before execution: replace 0 with your measured conservative byte
    # estimate for model weights plus maximum context/KV and runtime overhead.
    # On Apple unified memory, include GPU allocations here and leave VRAM zero.
    ram_bytes: 0
telemetry:
  database: ./data/darwin.db
