version: 1
mode: local_only
runtime:
  max_turns: 8  # Shared iteration budget for initial work and active steering.
  # Reuse a currently operator-approved stored summary only when full-history
  # automatic routing has no eligible route. Never generates or approves one.
  auto_use_approved_summary: false
providers:
  - id: local-primary
    kind: ollama
    endpoint: http://127.0.0.1:11434
    request_timeout: 5m  # 100ms-5m; bounds the complete provider operation.
models:
  - id: local-fast
    provider: local-primary
    model: local-model-id
    locality: local
    capabilities: [chat, summarize, classify]
    # Required before automatic routing, tools, summaries, or compaction: replace
    # 0 with a conservative input-token limit supported by the installed model.
    # Keeping zero makes this template fail closed for those paths.
    context_tokens: 0
    # Local Ollama execution is treated as zero-cost for admission. Change this
    # operator estimate if the deployment has a nonzero per-attempt cost.
    estimated_cost: 0
    # Required before any local execution: replace 0 with your measured
    # conservative byte estimate for model weights plus maximum context/KV and
    # runtime overhead. Keeping zero denies local resource admission.
    # On Apple unified memory, include GPU allocations here and leave VRAM zero.
    ram_bytes: 0
tools:
  # Enable tools only after reviewing their roots and approval policy.
  enabled: false
memory:
  # Opt in only after selecting a private durable scope and retention policy.
  enabled: false
skills:
  # Automatic workflow learning is deliberately disabled in this install sample.
  enabled: false
  auto_draft: false
  auto_activate_after_validation: false
  learning:
    enabled: false
evaluation:
  # Subjective auxiliary judging is opt-in and may create provider traffic.
  llm_judge_enabled: false
telemetry:
  database: ./data/darwin.db
