version: 1
mode: local_only
daemon:
  # The stock daemon and Web UI accept loopback listeners only.
  listen: 127.0.0.1:7788
web_ui:
  enabled: true
  # One non-reserved path segment, for example /app or /darwin.
  path_prefix: /app
  # Empty derives the sole origin from daemon.listen. Additional entries must
  # be exact http loopback origins on the same port; this is not a CORS list.
  allowed_origins: []
  browser_session_ttl: 8h  # Valid range: 5m-24h; sessions do not survive restart.
runtime:
  max_turns: 8  # Shared iteration budget for initial work and active steering.
  # Reuse a currently operator-approved stored summary only when full-history
  # automatic routing has no eligible route. Never generates or approves one.
  auto_use_approved_summary: false
workboard:
  enabled: true
  scheduler:
    # Unattended execution is opt-in. Enabling it dispatches Ready cards, so
    # first configure independent bounded worker and local reviewer aliases.
    enabled: false
    interval: 5s
    max_active_claims: 3
    card_scan_limit: 10000
    # Enabling the scheduler requires explicit, configured aliases for both an
    # execution model and an independent local acceptance reviewer. Adaptive
    # routing is not used for either role.
    worker_model: ""
    acceptance_judge:
      enabled: false
      reviewer_model: ""
      max_cost: 0
      max_input_tokens: 0
      max_output_tokens: 0
      timeout: 30s
providers:
  - id: local-primary
    kind: ollama
    endpoint: http://127.0.0.1:11434
    request_timeout: 5m  # 100ms-5m; bounds the complete provider operation.
models:
  - id: local-fast
    provider: local-primary
    model: local-model-id
    locality: local
    capabilities: [chat, summarize, classify]
    # Required before automatic routing, tools, summaries, or compaction: replace
    # 0 with a conservative input-token limit supported by the installed model.
    # Keeping zero makes this template fail closed for those paths.
    context_tokens: 0
    # Local Ollama execution is treated as zero-cost for admission. Change this
    # operator estimate if the deployment has a nonzero per-attempt cost.
    estimated_cost: 0
    # Required before any local execution: replace 0 with your measured
    # conservative byte estimate for model weights plus maximum context/KV and
    # runtime overhead. Keeping zero denies local resource admission.
    # On Apple unified memory, include GPU allocations here and leave VRAM zero.
    ram_bytes: 0
tools:
  # Filesystem tools remain disabled. Agent-facing Workboard reads/writes are
  # separate gates; writes require reads and an interactive approval presenter.
  enabled: false
  workboard_read_enabled: false
  workboard_write_enabled: false
  max_turns: 8
memory:
  # Opt in only after selecting a private durable scope and retention policy.
  enabled: false
skills:
  # Automatic workflow learning is deliberately disabled in this install sample.
  enabled: false
  auto_draft: false
  auto_activate_after_validation: false
  learning:
    enabled: false
evaluation:
  # Subjective auxiliary judging is opt-in and may create provider traffic.
  llm_judge_enabled: false
security:
  # local_only enforces a deny transport, not only absence of cloud models.
  local_only_egress: deny
  # Side-effecting agent tools require an exact operator decision.
  default_tool_policy: ask
telemetry:
  database: ./data/darwin.db
