name: Release qualification (no publication)

# Select a reviewed branch/tag in the manual dispatch UI. github.sha is the
# immutable commit captured by that dispatch, not a moving checkout ref.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a leading v or build metadata
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify ${{ matrix.target }}
    timeout-minutes: 90
    env:
      # Use only the setup-go toolchain and repository module/workspace state.
      CGO_ENABLED: "0"
      GODEBUG: ""
      GOTOOLCHAIN: local
      GOENV: "off"
      GOEXPERIMENT: ""
      GOFLAGS: ""
      GOWORK: "off"
      GOAMD64: v1
      GOARM64: v8.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
            runner: macos-15-intel
            expected_os: darwin
            expected_arch: amd64
          - target: darwin/arm64
            runner: macos-15
            expected_os: darwin
            expected_arch: arm64
          - target: linux/amd64
            runner: ubuntu-24.04
            expected_os: linux
            expected_arch: amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            expected_os: linux
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the declared Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source and record native platform
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_NATIVE_OS: ${{ matrix.expected_os }}
          EXPECTED_NATIVE_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ ${#RELEASE_VERSION} -le 100 && "$RELEASE_VERSION" =~ $version_pattern ]]
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=${RELEASE_VERSION#*-}
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                exit 1
              fi
            done
          fi
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(go env GOOS)" = "$EXPECTED_NATIVE_OS"
          test "$(go env GOARCH)" = "$EXPECTED_NATIVE_ARCH"
          test "$(go env GOHOSTOS)" = "$EXPECTED_NATIVE_OS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_NATIVE_ARCH"
          {
            echo "version=$RELEASE_VERSION"
            echo "commit=$commit"
            echo "os=$(go env GOHOSTOS)"
            echo "arch=$(go env GOHOSTARCH)"
            echo "go=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Run quality gates
        id: check
        shell: bash
        run: make check
      - name: Run deterministic MVP and disposable-key packaging qualification
        id: qualification
        shell: bash
        env:
          DARWIN_RELEASE_VERSION: ${{ inputs.version }}
          DARWIN_RELEASE_COMMIT: ${{ github.sha }}
        run: make qualify-release
      - name: Confirm source remains unchanged
        id: unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Report evidence and limits
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          NATIVE_OS: ${{ steps.source.outputs.os }}
          NATIVE_ARCH: ${{ steps.source.outputs.arch }}
          GO_VERSION: ${{ steps.source.outputs.go }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          UNCHANGED_OUTCOME: ${{ steps.unchanged.outcome }}
        run: |
          {
            echo '## Release qualification — no publication'
            printf '\nRelease version: `%s`\n' "${RELEASE_VERSION:-unavailable}"
            printf '\nDispatched commit: `%s`\n' "$GITHUB_SHA"
            printf '\nVerified checkout: `%s`\n' "${SOURCE_COMMIT:-unavailable}"
            printf '\nObserved native platform: `%s/%s`; Go: `%s`\n' "${NATIVE_OS:-unavailable}" "${NATIVE_ARCH:-unavailable}" "${GO_VERSION:-unavailable}"
            printf '\n| Gate | Outcome |\n| --- | --- |\n'
            printf '| Source binding | %s |\n| make check | %s |\n| make qualify-release | %s |\n| Source unchanged | %s |\n' "$SOURCE_OUTCOME" "$CHECK_OUTCOME" "$QUALIFICATION_OUTCOME" "$UNCHANGED_OUTCOME"
            echo
            echo 'Only a successful qualification gate establishes the following evidence: deterministic MVP tests; two builds of each darwin/amd64, darwin/arm64, linux/amd64 and linux/arm64 artifact; identical unsigned bytes; exact six-member schema-2 collateral and target-specific dependency notices; format checks; disposable-key signing/verification; tamper rejection; execution of the native artifact version command; and a disposable native install, schema-28-to-29 migration, backup and rollback rehearsal.'
            echo
            echo 'This job natively executes only the observed platform above; the other three artifacts are cross-built and inspected. All four successful matrix jobs are required for four-target native evidence. Read the observed platform above; the workflow asserts it against the expected target instead of trusting the runner label alone. Failed/skipped gates do not qualify a release.'
            echo
            echo 'No live models, production signing key, tag, release, artifact upload, installation outside the disposable runner-local rehearsal, or publication. Logs and this summary are qualification evidence, not a release approval or independent build attestation.'
          } >> "$GITHUB_STEP_SUMMARY"
