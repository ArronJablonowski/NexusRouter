name: Release qualification (no publication)

# Select a reviewed branch/tag in the manual dispatch UI. github.sha is the
# immutable commit captured by that dispatch, not a moving checkout ref.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a leading v or build metadata
        required: true
        type: string
      candidate_record_sha256:
        description: Independently reviewed sha256 digest of the canonical candidate record for this exact version and commit
        required: true
        type: string
      license_evidence_sha256:
        description: Independently reviewed sha256 digest emitted by license-evidence freeze for this exact commit and Go toolchain
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify ${{ matrix.target }}
    timeout-minutes: 360
    env:
      # Use only the setup-go toolchain and repository module/workspace state.
      CGO_ENABLED: "0"
      GODEBUG: ""
      GOTOOLCHAIN: local
      GOENV: "off"
      GOEXPERIMENT: ""
      GOFLAGS: ""
      GOWORK: "off"
      GOAMD64: v1
      GOARM64: v8.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
            runner: macos-15-intel
            expected_os: darwin
            expected_arch: amd64
          - target: darwin/arm64
            runner: macos-15
            expected_os: darwin
            expected_arch: arm64
          - target: linux/amd64
            runner: ubuntu-24.04
            expected_os: linux
            expected_arch: amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            expected_os: linux
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the declared Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source and record native platform
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_CANDIDATE_RECORD_SHA256: ${{ inputs.candidate_record_sha256 }}
          EXPECTED_LICENSE_EVIDENCE_SHA256: ${{ inputs.license_evidence_sha256 }}
          EXPECTED_NATIVE_OS: ${{ matrix.expected_os }}
          EXPECTED_NATIVE_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ ${#RELEASE_VERSION} -le 100 && "$RELEASE_VERSION" =~ $version_pattern ]]
          [[ "$EXPECTED_CANDIDATE_RECORD_SHA256" =~ $digest_pattern ]]
          [[ "$EXPECTED_LICENSE_EVIDENCE_SHA256" =~ $digest_pattern ]]
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=${RELEASE_VERSION#*-}
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                exit 1
              fi
            done
          fi
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(go env GOOS)" = "$EXPECTED_NATIVE_OS"
          test "$(go env GOARCH)" = "$EXPECTED_NATIVE_ARCH"
          test "$(go env GOHOSTOS)" = "$EXPECTED_NATIVE_OS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_NATIVE_ARCH"
          {
            echo "version=$RELEASE_VERSION"
            echo "candidate_record_sha256=$EXPECTED_CANDIDATE_RECORD_SHA256"
            echo "license_evidence_sha256=$EXPECTED_LICENSE_EVIDENCE_SHA256"
            echo "commit=$commit"
            echo "os=$(go env GOHOSTOS)"
            echo "arch=$(go env GOHOSTARCH)"
            echo "go=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Re-derive approved candidate record
        id: candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_CANDIDATE_RECORD_SHA256: ${{ steps.source.outputs.candidate_record_sha256 }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/nexusrouter-candidate.json"
          go run ./cmd/release-candidate freeze \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --source . --out "$candidate"
          actual="sha256:$(shasum -a 256 "$candidate" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_CANDIDATE_RECORD_SHA256"
          go run ./cmd/release-candidate verify --record "$candidate" --source .
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
      - name: Re-derive reviewed candidate license evidence
        id: license_evidence
        shell: bash
        env:
          EXPECTED_LICENSE_EVIDENCE_SHA256: ${{ steps.source.outputs.license_evidence_sha256 }}
          DARWIN_LICENSE_BOOTSTRAP_PARENT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nexusrouter-license-evidence.json"
          actual=$(sh scripts/license-evidence-bootstrap.sh freeze --commit "$GITHUB_SHA" --source . --out "$evidence")
          test "$actual" = "$EXPECTED_LICENSE_EVIDENCE_SHA256"
          DARWIN_LICENSE_EVIDENCE_RECORD="$evidence" \
          DARWIN_LICENSE_EVIDENCE_SHA256="$EXPECTED_LICENSE_EVIDENCE_SHA256" \
            make qualify-license-evidence
      - name: Run canonical native qualification
        id: native_evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_NATIVE_OS: ${{ matrix.expected_os }}
          EXPECTED_NATIVE_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_GO_VERSION: ${{ steps.source.outputs.go }}
        run: |
          set -euo pipefail
          umask 077
          record="$RUNNER_TEMP/native-${EXPECTED_NATIVE_OS}-${EXPECTED_NATIVE_ARCH}.json"
          install_record="$RUNNER_TEMP/install-${EXPECTED_NATIVE_OS}-${EXPECTED_NATIVE_ARCH}.json"
          install_verification="$RUNNER_TEMP/install-${EXPECTED_NATIVE_OS}-${EXPECTED_NATIVE_ARCH}-verification.json"
          native_verification="$RUNNER_TEMP/native-${EXPECTED_NATIVE_OS}-${EXPECTED_NATIVE_ARCH}-verification.json"
          transcript="$RUNNER_TEMP/native-${EXPECTED_NATIVE_OS}-${EXPECTED_NATIVE_ARCH}.log"
          go run ./cmd/native-release-evidence \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --source . --out "$record" \
            --install-rehearsal-out "$install_record" \
            > "$transcript" 2>&1
          record_sha256="sha256:$(shasum -a 256 "$record" | awk '{print $1}')"
          install_record_sha256="sha256:$(shasum -a 256 "$install_record" | awk '{print $1}')"
          transcript_sha256="sha256:$(shasum -a 256 "$transcript" | awk '{print $1}')"
          test "$(grep -c '^darwin-install-rehearsal-evidence ' "$transcript")" -eq 1
          read -r marker record_value artifact_name_value artifact_value backup_value source_value current_value \
            < <(grep '^darwin-install-rehearsal-evidence ' "$transcript")
          test "$marker" = darwin-install-rehearsal-evidence
          test "$record_value" != "${record_value#record_sha256=}"
          test "$artifact_name_value" != "${artifact_name_value#artifact_name=}"
          test "$artifact_value" != "${artifact_value#artifact_sha256=}"
          test "$backup_value" != "${backup_value#backup_sha256=}"
          test "$source_value" != "${source_value#source_schema=}"
          test "$current_value" != "${current_value#current_schema=}"
          test "${record_value#record_sha256=}" = "$install_record_sha256"
          artifact_name="${artifact_name_value#artifact_name=}"
          artifact_sha256="${artifact_value#artifact_sha256=}"
          backup_sha256="${backup_value#backup_sha256=}"
          source_schema="${source_value#source_schema=}"
          current_schema="${current_value#current_schema=}"
          test "$artifact_name" = "NexusRouter_${RELEASE_VERSION}_${EXPECTED_NATIVE_OS}_${EXPECTED_NATIVE_ARCH}.tar.gz"
          test "$source_schema" = 29
          test "$current_schema" = 53
          go run ./cmd/verify-install-rehearsal \
            --record "$install_record" --record-sha256 "$install_record_sha256" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --target-os "$EXPECTED_NATIVE_OS" --target-arch "$EXPECTED_NATIVE_ARCH" \
            --artifact "$artifact_name" --artifact-sha256 "$artifact_sha256" \
            --source-schema "$source_schema" --current-schema "$current_schema" \
            --backup-sha256 "$backup_sha256" > "$install_verification"
          install_verification_sha256="sha256:$(shasum -a 256 "$install_verification" | awk '{print $1}')"
          go run ./cmd/verify-native-release-evidence \
            --record "$record" --record-sha256 "$record_sha256" \
            --install-rehearsal-record "$install_record" \
            --install-rehearsal-record-sha256 "$install_record_sha256" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --target-os "$EXPECTED_NATIVE_OS" --target-arch "$EXPECTED_NATIVE_ARCH" \
            --go-version "$EXPECTED_GO_VERSION" \
            --artifact "$artifact_name" --artifact-sha256 "$artifact_sha256" \
            --source-schema "$source_schema" --current-schema "$current_schema" \
            --backup-sha256 "$backup_sha256" > "$native_verification"
          native_verification_sha256="sha256:$(shasum -a 256 "$native_verification" | awk '{print $1}')"
          test "$(wc -c < "$record" | tr -d ' ')" -le 32768
          test "$(wc -c < "$install_record" | tr -d ' ')" -le 32768
          test "$(wc -c < "$install_verification" | tr -d ' ')" -le 32768
          test "$(wc -c < "$native_verification" | tr -d ' ')" -le 32768
          test "$(wc -c < "$transcript" | tr -d ' ')" -le 2099200
          echo "record_sha256=$record_sha256" >> "$GITHUB_OUTPUT"
          echo "install_record_sha256=$install_record_sha256" >> "$GITHUB_OUTPUT"
          echo "install_verification_sha256=$install_verification_sha256" >> "$GITHUB_OUTPUT"
          echo "native_verification_sha256=$native_verification_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "backup_sha256=$backup_sha256" >> "$GITHUB_OUTPUT"
          echo "transcript_sha256=$transcript_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain canonical native evidence
        if: ${{ steps.native_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexusrouter-native-${{ matrix.expected_os }}-${{ matrix.expected_arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-${{ matrix.expected_os }}-${{ matrix.expected_arch }}.json
            ${{ runner.temp }}/native-${{ matrix.expected_os }}-${{ matrix.expected_arch }}.log
            ${{ runner.temp }}/native-${{ matrix.expected_os }}-${{ matrix.expected_arch }}-verification.json
            ${{ runner.temp }}/install-${{ matrix.expected_os }}-${{ matrix.expected_arch }}.json
            ${{ runner.temp }}/install-${{ matrix.expected_os }}-${{ matrix.expected_arch }}-verification.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          overwrite: false
          include-hidden-files: false
      - name: Confirm source remains unchanged
        id: unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Report evidence and limits
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          NATIVE_OS: ${{ steps.source.outputs.os }}
          NATIVE_ARCH: ${{ steps.source.outputs.arch }}
          GO_VERSION: ${{ steps.source.outputs.go }}
          CANDIDATE_RECORD_SHA256: ${{ steps.source.outputs.candidate_record_sha256 }}
          LICENSE_EVIDENCE_SHA256: ${{ steps.source.outputs.license_evidence_sha256 }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          LICENSE_EVIDENCE_OUTCOME: ${{ steps.license_evidence.outcome }}
          NATIVE_EVIDENCE_OUTCOME: ${{ steps.native_evidence.outcome }}
          NATIVE_RECORD_SHA256: ${{ steps.native_evidence.outputs.record_sha256 }}
          INSTALL_RECORD_SHA256: ${{ steps.native_evidence.outputs.install_record_sha256 }}
          INSTALL_VERIFICATION_SHA256: ${{ steps.native_evidence.outputs.install_verification_sha256 }}
          NATIVE_VERIFICATION_SHA256: ${{ steps.native_evidence.outputs.native_verification_sha256 }}
          INSTALL_ARTIFACT_SHA256: ${{ steps.native_evidence.outputs.artifact_sha256 }}
          INSTALL_BACKUP_SHA256: ${{ steps.native_evidence.outputs.backup_sha256 }}
          NATIVE_TRANSCRIPT_SHA256: ${{ steps.native_evidence.outputs.transcript_sha256 }}
          UNCHANGED_OUTCOME: ${{ steps.unchanged.outcome }}
        run: |
          {
            echo '## Release qualification — no publication'
            printf '\nRelease version: `%s`\n' "${RELEASE_VERSION:-unavailable}"
            printf '\nDispatched commit: `%s`\n' "$GITHUB_SHA"
            printf '\nVerified checkout: `%s`\n' "${SOURCE_COMMIT:-unavailable}"
            printf '\nObserved native platform: `%s/%s`; Go: `%s`\n' "${NATIVE_OS:-unavailable}" "${NATIVE_ARCH:-unavailable}" "${GO_VERSION:-unavailable}"
            printf '\nExpected reviewed candidate-record digest: `%s`\n' "$CANDIDATE_RECORD_SHA256"
            printf '\nExpected reviewed candidate license-evidence digest: `%s`\n' "$LICENSE_EVIDENCE_SHA256"
            printf '\n| Gate | Outcome |\n| --- | --- |\n'
            printf '| Source binding | %s |\n| Candidate record | %s |\n| Candidate license evidence | %s |\n| Canonical native evidence | %s |\n| Source unchanged | %s |\n' "$SOURCE_OUTCOME" "$CANDIDATE_OUTCOME" "$LICENSE_EVIDENCE_OUTCOME" "$NATIVE_EVIDENCE_OUTCOME" "$UNCHANGED_OUTCOME"
            printf '\nNative evidence record SHA-256: `%s`\n' "${NATIVE_RECORD_SHA256:-unavailable}"
            printf '\nInstall rehearsal record SHA-256: `%s`\n' "${INSTALL_RECORD_SHA256:-unavailable}"
            printf '\nInstall rehearsal in-job verification SHA-256: `%s`\n' "${INSTALL_VERIFICATION_SHA256:-unavailable}"
            printf '\nNative/install combined verification SHA-256: `%s`\n' "${NATIVE_VERIFICATION_SHA256:-unavailable}"
            printf '\nObserved native archive SHA-256: `%s`\n' "${INSTALL_ARTIFACT_SHA256:-unavailable}"
            printf '\nObserved immutable backup SHA-256: `%s`\n' "${INSTALL_BACKUP_SHA256:-unavailable}"
            printf '\nNative gate transcript SHA-256: `%s`\n' "${NATIVE_TRANSCRIPT_SHA256:-unavailable}"
            echo
            echo 'Only successful license-evidence and qualification gates establish the following evidence: the exact source commit, Go version and module directive, root MIT license digest, four target-specific dependency closures and notice digests; deterministic MVP tests; deterministic local-fixture context-recovery and Unix SIGKILL tests with no accepted skips; two builds of each darwin/amd64, darwin/arm64, linux/amd64 and linux/arm64 artifact; identical unsigned bytes; exact seven-member schema-3 archive metadata; target-specific canonical SPDX 2.3 module inventories bound to each binary, dependency/toolchain closure and first-party Web UI source hashes; target-specific dependency notices; format checks; disposable-key signing/verification; tamper rejection; execution of the native artifact version command; and a disposable native install, schema-29-to-53 migration, backup and rollback rehearsal.'
            echo
            echo 'This job natively executes only the observed platform above; the other three artifacts are cross-built and inspected. All four successful matrix jobs are required for four-target native evidence. Read the observed platform above; the workflow asserts it against the expected target instead of trusting the runner label alone. Failed/skipped gates do not qualify a release.'
            echo
            echo 'The SBOM is module-level SPDX 2.3 inventory, not vulnerability scanning, build provenance, or a legal conclusion; unreviewed dependency license expressions remain NOASSERTION. The context-recovery gate uses deterministic local fixtures and Unix SIGKILL; it is not live-provider, physical power-loss, filesystem-flush, disk-failure, or hardware-provenance evidence, and a skipped test is not qualification. The supplied candidate and license-evidence digests are independent dispatch inputs; this workflow checks exact derivation. The native archive and backup digests are generated observations from this job, emitted through the bounded native transcript, bound into the primary native record, and checked against the canonical install-rehearsal record in the same job. The offline combined verifier validates retained canonical bytes and cross-record identity; it does not authenticate the transcript, prove physical hardware or virtualization provenance, or provide human approval. The observed archive and backup digests are not independently approved expectations; a later operator must obtain and verify the retained records and digests through the external evidence channel. This workflow does not grant candidate, platform or release approval and does not grant legal approval. A successful job retains its bounded native record, install-rehearsal record, both verification results, and gate transcript for 30 days. No release archive, live model output, production signing key, tag, GitHub release asset, installation outside the disposable runner-local rehearsal, or publication. Records, transcripts and this summary are qualification evidence, not release approval or independent build attestation.'
          } >> "$GITHUB_STEP_SUMMARY"
